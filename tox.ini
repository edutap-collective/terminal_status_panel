[tox]
# Every interpreter the package claims support for in pyproject.toml. The
# operating-system matrix lives in CI, which has the runners for it -- this
# file covers what a developer can reproduce locally.
envlist = py311,py312,py313,py314,lint
isolated_build = true

[testenv]
runner = uv-venv-runner
dependency_groups = test
commands = pytest {posargs}

[testenv:lint]
basepython = py313
dependency_groups = dev
commands =
    ruff check src tests tools
    ruff format --check src tests tools
    ty check src
