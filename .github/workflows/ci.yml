name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nothing here is locked: uv.lock is git-ignored and every requirement is a
  # lower bound. A suite that passed last week can fail today with nothing
  # changed here, and a weekly run is what surfaces that.
  schedule:
    - cron: "17 5 * * 1"
  # Callable, so the release workflow runs *these* checks rather than its own
  # copy. A release gate that restates the checks drifts from them, and it
  # drifts silently -- nobody reads two files side by side.
  workflow_call:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # macOS verifies the Darwin branches for real: the SystemVersion
          # plist, APFS disk_partitions, the absent Docker socket. The oldest
          # and newest supported interpreters are enough to catch a break.
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      # --no-default-groups: without it uv adds `dev` on top, so every matrix
      # entry would also install ruff, ty and the logo tooling it never runs.
      - run: uv sync --no-default-groups --group test
      - run: uv run --no-sync python -m pytest

  # The matrix above resolves to whatever is current, so it says nothing about
  # the lower bounds in pyproject.toml. This job installs exactly those bounds
  # and runs the same suite. It runs on both ends of the supported interpreter
  # range on purpose: docker 5.0.3 passes everything on 3.11 and cannot be
  # imported on 3.12+, so a floor checked only against the oldest Python would
  # publish a compatibility claim the package does not keep.
  minimum-deps:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      # --resolution lowest-direct: the oldest version each *declared* bound
      # allows, while transitive dependencies stay current. `lowest` would pin
      # the whole tree to its oldest resolvable state, which tests other
      # projects' floors rather than this project's.
      - run: uv sync --no-default-groups --group test --resolution lowest-direct
      - run: uv pip list
      - run: uv run --no-sync python -m pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync --group dev
      - run: uv run --no-sync python -m ruff check src tests tools
      - run: uv run --no-sync python -m ruff format --check src tests tools
      # Ruff's own F811 does not cover this: it fires only while the first
      # binding is unused, and a pasted block whose names are called between
      # the two copies never looks unused to it. See the tool's docstring.
      - run: uv run --no-sync python tools/check_redefinitions.py
      - run: uv run --no-sync python -m ty check src

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          usesh: true
          # Do not pin the Python version: FreeBSD moves its default flavour
          # between releases, and the py311-* packages this job first asked for
          # no longer exist in 14.3's repository. Install the default `python3`
          # and derive the flavour prefix from it, so the job follows whatever
          # the release ships instead of guessing.
          #
          # psutil and cryptography come from pkg rather than pip: both carry
          # compiled extensions, there are no wheels for FreeBSD, and building
          # them from source is the difference between a one-minute job and a
          # ten-minute one.
          prepare: |
            set -e
            pkg install -y python3
            PYVER=$(python3 -c 'import sys; print(f"{sys.version_info.major}{sys.version_info.minor}")')
            echo "FreeBSD default Python flavour: py${PYVER}"
            pkg install -y "py${PYVER}-pip" "py${PYVER}-psutil" "py${PYVER}-sqlite3" \
              "py${PYVER}-cryptography"
          # The test requirements are named here rather than installed as a
          # dependency group: `pip install --group` needs pip 25.1, and this job
          # deliberately takes whatever pip the FreeBSD release ships.
          #
          # This list must be kept in step with the `test` group in
          # pyproject.toml by hand, and has already drifted once: cryptography
          # was added there for the TLS tests and this job went red on the next
          # push. pyproject.toml carries a note pointing back here.
          run: |
            set -e
            python3 -m pip install --break-system-packages -e .
            python3 -m pip install --break-system-packages pytest pytest-cov
            python3 -m pytest
