name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # macOS verifies the Darwin branches for real: the SystemVersion
          # plist, APFS disk_partitions, the absent Docker socket. The oldest
          # and newest supported interpreters are enough to catch a break.
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]' ruff
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: python -m pytest

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          usesh: true
          # Do not pin the Python version: FreeBSD moves its default flavour
          # between releases, and the py311-* packages this job first asked for
          # no longer exist in 14.3's repository. Install the default `python3`
          # and derive the flavour prefix from it, so the job follows whatever
          # the release ships instead of guessing.
          #
          # psutil comes from pkg rather than pip because building it from
          # source is the difference between a one-minute job and a ten-minute
          # one.
          prepare: |
            set -e
            pkg install -y python3
            PYVER=$(python3 -c 'import sys; print(f"{sys.version_info.major}{sys.version_info.minor}")')
            echo "FreeBSD default Python flavour: py${PYVER}"
            pkg install -y "py${PYVER}-pip" "py${PYVER}-psutil" "py${PYVER}-sqlite3"
          run: |
            set -e
            python3 -m pip install --break-system-packages -e '.[test]'
            python3 -m pytest
