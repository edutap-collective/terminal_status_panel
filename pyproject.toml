[project]
name = "terminal-status-panel"
version = "0.12.0"
description = "Colorful login status panel for servers: system, resources, and Docker Swarm health"
readme = "README.md"
requires-python = ">=3.11"
license = "EUPL-1.2"
license-files = ["LICENSE"]
keywords = ["motd", "status", "dashboard", "docker", "swarm", "server", "terminal", "rich"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Monitoring",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
]
authors = [
	{ name = "Alexander Loechel", email = "Alexander.Loechel@lmu.de" }
]
# Every lower bound below was measured rather than guessed: the suite runs
# green at exactly these versions on Python 3.11 and on 3.14, the two ends of
# the supported range. The `minimum-deps` CI job pins them there on every push
# so the claim keeps being true. There are no upper bounds -- one belongs here
# only once an incompatibility is demonstrated, not in anticipation of it.
#
# Deriving a floor from the oldest interpreter alone would publish a false
# claim: docker 5.0.3 passes the whole suite on 3.11 and cannot even be
# imported on 3.12 or later, because it reaches for `distutils`.
dependencies = [
    # 15.0 is the first release whose `cell_len` measures every glyph in the
    # status vocabulary the way a terminal does. Up to 14.1 it reports `⚠️`
    # (U+26A0 U+FE0F) as one cell where the terminal draws two, so every
    # warning row in the panel was one column out. Measured across 12.6, 13.0,
    # 13.3.5, 13.7.1, 13.9.4, 14.0, 14.1 and 15.0; the change lands in 15.0.
    #
    # Every older construction the panel uses (Group, Table.grid,
    # Text.from_ansi, Screen) works from 12.6, so this floor is about layout
    # correctness rather than API availability -- but a status panel whose
    # columns do not line up is not doing its job.
    "rich>=15.0",
    # 6.0 is the floor Python sets, not the API: 5.x imports `distutils`,
    # removed in 3.12. `container.stats(one_shot=True)` needs 5.0 anyway.
    "docker>=6.0",
    # 5.9.8 is the oldest release with wheels across 3.11-3.14. Older ones do
    # work, but only by compiling on the target, and this is a package that
    # gets installed on servers.
    "psutil>=5.9.8",
    "distro>=1.5",
    # 2.0 renamed `query` to `resolve`, which is what the DNS collector calls.
    # Querying resolvers directly is the point: getaddrinfo would hide
    # /etc/hosts divergence.
    "dnspython>=2.0",
    # 6.0.1 is the first that builds on 3.14; 6.0 has no wheel for it and its
    # source build fails. Parses the Traefik file-provider config.
    "pyyaml>=6.0.1",
    # The optional cross-check against Traefik's own /api/rawdata. httpx2 is
    # the maintained continuation of httpx (github.com/pydantic/httpx2) and
    # what the sibling packages use. 2.12 is its first release.
    "httpx2>=2.12",
]

# Development tooling lives in dependency groups (PEP 735), not in extras.
# An extra is part of the published metadata and anyone installing the package
# can select it; a group is local to this checkout and never reaches PyPI.
# Nothing here is something a consumer of the panel would ever want.
[dependency-groups]
test = [
    "pytest>=8",
    "pytest-cov",
    # Test-only: the Traefik cross-check builds an SSLContext from a client
    # certificate, and the only honest way to test that is with a real one.
    #
    # Adding anything here means editing .github/workflows/ci.yml too: the
    # FreeBSD job installs these by name because its pip predates
    # `--group`, and it goes red on the next push if the two drift.
    # Generated per run rather than committed -- a fixture certificate expires,
    # and a suite that goes red one morning for a reason unrelated to the
    # change that triggered it teaches people to ignore it.
    "cryptography>=44",
    # Bounded for the same reason the runtime dependencies are, and with more
    # urgency: uv resolves every group together, so an unconstrained tool drags
    # the *whole* resolution down under `--resolution lowest-direct`. The
    # minimum-deps job first went red on pillow 1.0 -- a 2010 release whose
    # setup.py is Python 2 -- pulled in by the dev group while installing only
    # this one.
    "pytest-cov>=5",
]
typecheck = ["ty>=0.0.70"]
# Sphinx 8 is the first release that supports Python 3.13, and the docs build
# runs on whatever interpreter the checkout has. myst-parser 4 is the one that
# pairs with it.
docs = [
    "sphinx>=8",
    "myst-parser>=4",
    "sphinx-autobuild>=2024.10",
]
dev = [
    {include-group = "test"},
    {include-group = "typecheck"},
    {include-group = "docs"},
    "pdbp>=1.5",
    "ruff>=0.16,<0.17",
    "pillow>=11",  # only to regenerate bundled logos via tools/generate_logos.py
]

[project.scripts]
status-full = "terminal_status_panel.cli:main"
status-server = "terminal_status_panel.cli:server_main"
status-docker = "terminal_status_panel.cli:docker_main"
status-health = "terminal_status_panel.cli:health_main"
status-traefik = "terminal_status_panel.cli:traefik_main"
install-panel = "terminal_status_panel.install:main"

[project.urls]
Homepage = "https://github.com/edutap-collective/terminal_status_panel"
Repository = "https://github.com/edutap-collective/terminal_status_panel"
Issues = "https://github.com/edutap-collective/terminal_status_panel/issues"

[build-system]
# Measured by building this project with each: 1.26.3 produces a wheel whose
# METADATA carries the legacy `License: EUPL-1.2` and no `License-File` at all
# -- the LICENSE file is dropped without a warning. 1.27.0 emits
# `License-Expression: EUPL-1.2` and `License-File: LICENSE`, which is what
# `license` and `license-files` above are written for. 1.24.2 cannot build
# this project at all.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/terminal_status_panel"]
artifacts = ["**/*.ans"]  # pre-rendered half-block OS logos

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "tools", "README.md", "LICENSE", "pyproject.toml"]




[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov-report term --cov=terminal_status_panel --cov-report html"
testpaths = [
    "tests"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
# Written out rather than inherited: adopting a formatter is a decision about
# every file in the repository, so it should be readable as one.
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
# The rule set the sibling packages use, plus C901.
select = ["E", "F", "W", "B", "I", "UP", "D", "S", "C901"]
# D203/D213 contradict the other pydocstyle rules ruff applies, so they are
# excluded for that reason rather than by preference.
#
# D401 (imperative mood) is a deliberate departure from the sibling packages.
# This codebase documents by describing the thing rather than the call -- "The
# panel's status vocabulary", "True when the task runs" -- and the rule fires
# 49 times without a single "Returns the ..." among them. For a property in
# particular, "Return true when the task runs" is the worse sentence. Enforcing
# it would mean rewriting 49 good docstrings into weaker ones.
ignore = ["D203", "D213", "D401"]

[tool.ruff.lint.mccabe]
# Every function in `src/` is under this today, so the limit is a floor that
# holds rather than a target to work towards. It is here because the code got
# here the other way round: `collect_traefik` reached 21 and `parse_labels` 16
# one branch at a time, each addition reasonable on its own, and nothing said
# anything until a review counted them.
#
# 10 is not sacred. A function that genuinely needs more should carry a
# `# noqa: C901` with the reason -- an argued exception is worth more than a
# threshold quietly raised for everyone.
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# `tests/**` rather than `tests/*`: a single star does not cross a directory
# separator. Tests carry no docstring requirement, and `assert` is what a test
# is made of -- S101 fires 1416 times across this suite and says nothing.
# S108 fires on "/tmp/" in test_platform_defaults, where it is a mountpoint
# *value* fed to the ignore-list logic, not a file anything opens.
"tests/**" = ["D", "S101", "S108"]
# One-off developer scripts, not API.
"tools/**" = ["D"]
# Fixture data quoted verbatim from the systems it describes: a cluster status
# payload and a set of Traefik router labels. The formatter cannot break a
# string literal, and rewrapping the fixture by hand would mean the test no
# longer shows what the real input looks like.
"tests/test_collectors_clusters.py" = ["E501"]
"tests/test_collectors_traefik_parse.py" = ["E501"]
