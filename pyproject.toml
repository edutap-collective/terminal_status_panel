[project]
name = "terminal-status-panel"
version = "0.5.0"
description = "Colorful login status panel for servers: system, resources, and Docker Swarm health"
readme = "README.md"
requires-python = ">=3.11"
license = "EUPL-1.2"
license-files = ["LICENSE"]
keywords = ["motd", "status", "dashboard", "docker", "swarm", "server", "terminal", "rich"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Monitoring",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
]
authors = [
	{ name = "Alexander Loechel", email = "Alexander.Loechel@lmu.de" }
]
dependencies = [
    "rich",
    "docker",
    "psutil",
    "distro",
    "dnspython",  # query resolvers directly: getaddrinfo would hide /etc/hosts divergence
    "pyyaml",  # parse the Traefik file-provider config (api and ping-router routers)
    "httpx",  # the optional cross-check against Traefik's own /api/rawdata
]

# Development tooling lives in dependency groups (PEP 735), not in extras.
# An extra is part of the published metadata and anyone installing the package
# can select it; a group is local to this checkout and never reaches PyPI.
# Nothing here is something a consumer of the panel would ever want.
[dependency-groups]
test = [
    "pytest>=8",
    "pytest-cov",
]
typecheck = ["ty"]
dev = [
    {include-group = "test"},
    {include-group = "typecheck"},
    "pdbp",
    "ruff>=0.16,<0.17",
    "pillow",  # only to regenerate bundled logos via tools/generate_logos.py
]

[project.scripts]
status-full = "terminal_status_panel.cli:main"
status-server = "terminal_status_panel.cli:server_main"
status-docker = "terminal_status_panel.cli:docker_main"
status-health = "terminal_status_panel.cli:health_main"
status-traefik = "terminal_status_panel.cli:traefik_main"
install-panel = "terminal_status_panel.install:main"

[project.urls]
Homepage = "https://github.com/edutap-collective/terminal_status_panel"
Repository = "https://github.com/edutap-collective/terminal_status_panel"
Issues = "https://github.com/edutap-collective/terminal_status_panel/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/terminal_status_panel"]
artifacts = ["**/*.ans"]  # pre-rendered half-block OS logos

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "tools", "README.md", "LICENSE", "pyproject.toml"]




[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov-report term --cov=terminal_status_panel --cov-report html"
testpaths = [
    "tests"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
# Written out rather than inherited: adopting a formatter is a decision about
# every file in the repository, so it should be readable as one.
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Fixture data quoted verbatim from the systems it describes: a cluster status
# payload and a set of Traefik router labels. The formatter cannot break a
# string literal, and rewrapping the fixture by hand would mean the test no
# longer shows what the real input looks like.
"tests/test_collectors_clusters.py" = ["E501"]
"tests/test_collectors_traefik_parse.py" = ["E501"]
